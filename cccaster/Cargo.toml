[package]
name = "cccaster"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
blake3 = { version = "1.8.4", features = ["rayon"] }
color-print = "0.3.7"
ctor = "0.8.0"
globset = { version = "0.4.18", features = ["simd-accel"] }
json5 = "1.3.1"
lazy_static = "1.5.0"
libc = "0.2.184"
mlua = { version = "0.11.6", features = [
    "luau-jit",
    "vendored",
    "async",
    "serde",
    "mlua_derive",
    "macros",
    "anyhow",
] }
notify = "8.2.0"
once_cell = "1.21.4"
petgraph = { version = "0.8.3", features = ["rayon", "serde-1"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.45"
tokio = { version = "1.50.0", features = ["full", "parking_lot"] }
tree-sitter = "0.26.8"
tree-sitter-luau = "1.2.0"
wasmtime = { version = "43.0.1" }
zstd = "0.13.3"
