[package]
name = "cccaster"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
blake3 = { version = "1.8.3", features = ["rayon"] }
color-print = "0.3.7"
ctor = "0.8.0"
lazy_static = "1.5.0"
libc = "0.2.183"
mlua = { version = "0.11.6", features = [
    "luau-jit",
    "vendored",
    "async",
    "serde",
    "mlua_derive",
    "macros",
    "anyhow",
] }
notify = "8.2.0"
once_cell = "1.21.4"
petgraph = { version = "0.8.3", features = ["rayon", "serde-1"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full", "parking_lot"] }
